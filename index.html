<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>My Basic Site</title>
    <style>
        :root{
            --bg-1:#f6fbff;
            --bg-2:#eaf6ff;
            --card:#ffffff;
            --accent:#007acc;
            --accent-2:#ff6b6b;
            --text:#0f1720;
            --muted:#5b6b72;
            --max-w:980px;
        }
        *{box-sizing:border-box}
        body{
            font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,Helvetica,sans-serif;
            line-height:1.6;margin:0;padding:0;color:var(--text);
            background:linear-gradient(180deg,var(--bg-1),var(--bg-2));
            -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
        }
        .container{max-width:var(--max-w);margin:0 auto;padding:0 1rem}
        header{background:linear-gradient(90deg,var(--accent),#005a9e);color:#fff;padding:1.25rem 0;box-shadow:0 6px 18px rgba(2,6,23,0.08)}
        header h1{margin:0;font-weight:600}
        .subtitle{margin:0.25rem 0 0;color:rgba(255,255,255,0.9);font-weight:400}
        nav{margin-top:0.6rem}
        nav a{color:rgba(255,255,255,0.95);margin-right:1rem;text-decoration:none;padding:0.25rem 0;transition:opacity .15s ease}
        nav a:hover{opacity:0.9;text-decoration:underline}
        main{padding:2rem 0}
        section{background:var(--card);padding:1.25rem;border-radius:10px;box-shadow:0 10px 30px rgba(2,6,23,0.06);margin-bottom:1rem}
        section h2{margin-top:0}
        .profile{border-left:4px solid var(--accent);padding-left:0.85rem;margin:0.5rem 0}
        .profile strong{color:var(--accent-2)}
        a.email{color:var(--accent);text-decoration:none}
        a.email:hover{text-decoration:underline}
        footer{padding:1rem 0;background:transparent;text-align:center;color:var(--muted);font-size:0.95rem}
        @media (min-width:700px){
            nav{float:right;margin-top:-2.1rem}
            header .container{display:flex;align-items:center;justify-content:space-between}
            .subtitle{order:2;margin-left:1rem}
        }

        /* Sign-in form styles */
        form.auth{display:block;gap:0.75rem;max-width:520px}
        .form-row{display:flex;flex-direction:column;margin-bottom:0.6rem}
        label{font-size:0.9rem;color:var(--muted);margin-bottom:0.35rem}
        input[type="text"],input[type="email"],input[type="password"]{padding:0.6rem 0.75rem;border:1px solid #e6eef6;border-radius:8px;font-size:1rem}
        .controls{display:flex;align-items:center;gap:0.5rem}
        .hint{font-size:0.85rem;color:var(--muted)}
        .btn{display:inline-block;background:var(--accent);color:#fff;padding:0.55rem 0.9rem;border-radius:8px;border:none;cursor:pointer}
        .btn.secondary{background:transparent;color:var(--accent);border:1px solid rgba(0,122,204,0.12)}
        .strength{height:8px;border-radius:6px;background:linear-gradient(90deg,#eee,#eee);overflow:hidden}
        .strength > i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .25s ease}
        .form-inline{display:flex;gap:0.5rem;align-items:center}
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>My Basic Site</h1>
            <nav>
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </nav>
        </div>
    </header>
    <main class="container">
        <section id="home">
            <h2>Welcome</h2>
            <p>This is a minimal static HTML page.</p>
        </section>
        <section id="signin">
            <h2>Sign In</h2>
            <form class="auth" id="signinForm" onsubmit="return false">
                <div class="form-row">
                    <label for="name">Full name</label>
                    <input type="text" id="name" name="name" placeholder="Sandeep Kaur" required>
                </div>
                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="form-row">
                    <label for="password">Password</label>
                    <div class="form-inline">
                        <input type="password" id="password" name="password" placeholder="Choose a password" required>
                        <button class="btn secondary" id="togglePwd" type="button">Show</button>
                    </div>
                    <div style="margin-top:0.5rem">
                        <div class="hint">Password strength</div>
                        <div class="strength" aria-hidden="true"><i id="strengthBar"></i></div>
                    </div>
                </div>
                <div class="form-row">
                    <button class="btn" id="submitBtn" type="submit">Create account</button>
                    <span class="hint" style="margin-left:0.5rem">(This form is client-side only.)</span>
                </div>
            </form>
        </section>
        <section id="about">
            <h2>About</h2>
            <p>Built for demonstration purposes.</p>
        </section>
        <section id="contact">
            <h2>Contact</h2>
            <p>Email: example@example.com</p>
        </section>
    </main>
    <footer>
        <div class="container">&copy; 2026 My Basic Site</div>
    </footer>
    <script>
        (function(){
            const pwd = document.getElementById('password');
            const toggle = document.getElementById('togglePwd');
            const bar = document.getElementById('strengthBar');
            const form = document.getElementById('signinForm');

            function scorePassword(s){
                let score=0; if(!s) return 0;
                if(s.length>=8) score+=1; if(s.length>=12) score+=1;
                if(/[A-Z]/.test(s)) score+=1; if(/[0-9]/.test(s)) score+=1;
                if(/[^A-Za-z0-9]/.test(s)) score+=1; return score;
            }

            function updateStrength(){
                const sc = scorePassword(pwd.value);
                const pct = Math.min(100, (sc/5)*100);
                bar.style.width = pct + '%';
            }

            toggle && toggle.addEventListener('click', ()=>{
                if(pwd.type === 'password'){ pwd.type='text'; toggle.textContent='Hide'; }
                else { pwd.type='password'; toggle.textContent='Show'; }
            });
            pwd && pwd.addEventListener('input', updateStrength);

            form && form.addEventListener('submit', (e)=>{
                e.preventDefault();
                if(!form.checkValidity()){
                    alert('Please fill the form correctly.'); return;
                }
                // For demo only: show a success message
                alert('Account created (demo). Name: '+document.getElementById('name').value);
                form.reset(); updateStrength();
            });
        })();
    </script>
</body>
</html>
</html>
