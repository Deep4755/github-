<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>My Basic Site</title>
    <style>
        body{font-family:Arial,Helvetica,sans-serif;line-height:1.6;margin:0;padding:0;color:#333}
        header{background:#007acc;color:#fff;padding:1rem}
        nav a{color:#fff;margin-right:1rem;text-decoration:none}
        main{padding:1rem}
        footer{padding:1rem;background:#f4f4f4;text-align:center;font-size:0.9rem}
        .container{max-width:800px;margin:0 auto}
        button{background:#007acc;color:#fff;border:none;padding:0.5rem 1rem;border-radius:4px;cursor:pointer}
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>My Basic Site</h1>
            <nav>
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </nav>
        </div>
    </header>
    <main class="container">
        <section id="home">
            <h2>Welcome</h2>
            <p>This is a minimal static HTML page.</p>
        </section>
        <section id="about">
            <h2>About</h2>
            <p>Built for demonstration purposes.</p>
        </section>
        <section id="contact">
            <h2>Contact</h2>
            <p>Email: example@example.com</p>
        </section>
    </main>
    <footer>
        <div class="container">&copy; 2026 My Basic Site</div>
    </footer>
</body>
</html>
</html>
